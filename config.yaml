    sample: >
      Mink (Neogale vison) är ett nordamerikanskt semiakvatiskt mårddjur som har
      introducerats till många länder, bland annat Skandinavien, för
      pälsdjursuppfödning.


      Artepitet vison i det vetenskapliga namnet är bildat av det franska ordet för
      mink. Minkens tidigare vetenskapliga namn var Neovison vison, och innan det
      Mustela vison.


      Den vilda minken vistas främst i närheten av vattendrag, sjöar och våtmarker.
      Födan varierar, men utgörs sommartid i huvudsak av större kräftdjur, groddjur
      och mindre däggdjur (i Nordamerika främst bisam, i Europa smågnagare, hardjur
      och mullvad), samt sjöfågel, främst måsar och änder, speciellt ungar. Vintertid
      lever den huvudsakligen av fisk. På grund av beroendet av vatten för sin jakt
      har minkar ofta sin lya i en håla nära vatten, i t.ex. ett övergivet kaninhål. I
      lyan kan den vila och föda upp sina valpar. Deras habitat består ofta av ett
      linjärt område på flera kilometer längs med en flod eller liknande vattendrag.


      Eftersom vilda minkar lever nära vatten och är beroende av vatten för sin föda
      är de starkt motiverade att simma. Minkar vill även ha social kontakt, vill
      kunna använda flera olika lyor och vill kunna röra sig över stora områden. Detta
      gäller oavsett om minken är i vilt tillstånd eller om det handlar om farmad
      mink.


      Källa: https://sv.wikipedia.org/w/index.php?title=Mink&oldid=59528230

