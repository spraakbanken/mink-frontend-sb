# Structure must match the `AppConfig` type
backendUrl: https://ws.spraakbanken.gu.se/ws/mink/v3/
defaultLanguage: swe
minkUrl: https://spraakbanken.gu.se/mink

auth:
  apiUrl: https://sp.spraakbanken.gu.se/auth/
  guiUrl: https://spraakbanken.gu.se/auth/
  logoutUrl: https://sp.spraakbanken.gu.se/Shibboleth.sso/Logout

types:
  corpus:
    explore:
      korp:
        url: https://spraakbanken.gu.se/korp
      strix:
        url: https://spraakbanken.gu.se/strix
  lexicon:
    karps:
      url: https://spraakbanken.gu.se/karp
  metadata: true

sharing: true

tools:
  demo:
    sample: >
      Språkbanken stödjer forskning genom att tillgängliggöra data och utveckla
      språkteknologiska analyser och forskningsplattformar. Med Mink kan du använda
      analyserna och plattformarna för dataresurser som du själv skapar.


      Mink hanterar korpusar och lexikon. De två resurstyperna innehåller olika typer
      av data, och de processas på olika sätt, men arbetsflödet är i stort likadant i
      båda fallen.
  metadataEditor: true
